version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:00"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
    groups:
      development-toolchain:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:30"
      timezone: America/Los_Angeles
    open-pull-requests-limit: 5
